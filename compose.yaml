name: hse-guest-pass
x-runtime: &runtime
  build: .
  environment: &environment
    DATABASE_URL: postgresql+psycopg://qr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/qr
    API_KEY: ${API_KEY:?Set API_KEY in .env}
    PASS_SIGNING_KEY: ${PASS_SIGNING_KEY:?Set PASS_SIGNING_KEY in .env}
    ORGANIZER_IDS: ${ORGANIZER_IDS:-}
    EVENT_ID: ${EVENT_ID:-hse-businessclub-demo-2026}
    CHECKIN_POINTS: ${CHECKIN_POINTS:-10}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr -d qr"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${API_PORT:-18082}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    <<: *runtime
    profiles: ["telegram"]
    environment:
      <<: *environment
      BOT_TOKEN: ${BOT_TOKEN:-}
      BACKEND_URL: http://api:8000
    command: ["python", "-m", "app.bot"]
    depends_on:
      api:
        condition: service_healthy

  tests:
    <<: *runtime
    profiles: ["test"]
    environment:
      <<: *environment
      TEST_DATABASE_URL: postgresql+psycopg://qr:${POSTGRES_PASSWORD}@db:5432/qr
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    restart: "no"

volumes:
  pgdata:
