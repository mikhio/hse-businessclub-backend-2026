[project]
name = "hse-guest-pass"
version = "0.1.0"
description = "QR guest passes and auditable, idempotent event check-in"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "qrcode>=8,<9",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.32,<1",
  "zxing-cpp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["database: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL instance"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
